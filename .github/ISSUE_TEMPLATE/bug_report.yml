name: Bug report
description: Report a reproducible problem without device identifiers
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include an IMEI, serial number, phone number, Samsung account, firmware binary, or screenshot containing private information. Review local paths before attaching logs.

  - type: input
    id: version
    attributes:
      label: Samsung FUS CLI version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      description: Remove private paths and identifiers before submitting.
      placeholder: samsung-fus-cli check --model SM-S948Q --csc SJP --build BZI9
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and minimal error output
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all IMEI, serial number, phone number, account, and private path information.
          required: true
